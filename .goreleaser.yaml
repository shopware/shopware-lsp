version: 2
# The shipped server is Rust. Release binaries are compiled natively per target
# by .github/workflows/build-binaries.yml and laid out as
# target/<rust-triple>/release/shopware-lsp[.exe] before GoReleaser runs.
# GoReleaser's Rust builder then only collects them: `tool` is a no-op that
# fails when a prebuilt binary is missing, so GoReleaser never compiles
# anything. Archive, package, checksum and Homebrew names are unchanged from
# the former Go builds (GoReleaser maps the triples to the same os/arch,
# including armv7 -> linux_arm.zip, armhf.deb, armv7.apk, armv7hl.rpm; this
# needs GoReleaser >= 2.20).
project_name: shopware-lsp
builds:
  - id: shopware-lsp
    builder: rust
    binary: shopware-lsp
    tool: ./scripts/release/prebuilt-cargo.sh
    command: build
    flags:
      - --release
      - --package=swlsp-cli
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - armv7-unknown-linux-gnueabihf
      - x86_64-pc-windows-msvc
archives:
  - id: golang-cross
    ids:
      - shopware-lsp
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [ 'zip' ]
    wrap_in_directory: false
nfpms:
  - id: linux-packages
    ids:
      - shopware-lsp
    package_name: shopware-lsp
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: shopware AG
    homepage: https://github.com/shopware/shopware-lsp
    maintainer: Soner Sayakci <s.sayakci@shopware.com>
    description: Shopware Language Server
    license: MIT
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
release:
  github:
    owner: shopware
    name: shopware-lsp
  # The release stays a draft until the workflow has attached the VSIX
  # packages; the workflow then publishes it as stable or pre-release.
  # GoReleaser cannot detect the channel itself because both channels use
  # plain X.Y.Z tags (minor parity decides).
  draft: true
  replace_existing_artifacts: true

homebrew_casks:
  - repository:
      owner: shopware
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    ids:
      - golang-cross
    binaries:
      - shopware-lsp
    commit_author:
      name: shopwareBot
      email: 4725494+shopwareBot@users.noreply.github.com
    homepage: https://shopware.com
    description: Shopware Language Server
    directory: Casks
