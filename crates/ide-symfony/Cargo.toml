[package]
name = "swlsp-ide-symfony"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-ide = { path = "../ide" }
swlsp-lsp = { path = "../lsp" }
swlsp-language = { path = "../language" }
swlsp-symfony = { path = "../symfony" }
swlsp-parser-yaml = { path = "../parser-yaml" }
swlsp-parser-xml = { path = "../parser-xml" }
swlsp-asset = { path = "../asset" }
swlsp-console = { path = "../console" }
swlsp-lsp-phpanalysis = { path = "../lsp-phpanalysis" }
swlsp-lsp-protocol = { path = "../lsp-protocol" }
swlsp-messenger = { path = "../messenger" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-php = { path = "../php" }
swlsp-php-semantic = { path = "../php-semantic" }
swlsp-textutil = { path = "../textutil" }
swlsp-serializer = { path = "../serializer" }
swlsp-symfonyconfig = { path = "../symfonyconfig" }
swlsp-translation = { path = "../translation" }
swlsp-twig = { path = "../twig" }
swlsp-twigcomponent = { path = "../twigcomponent" }
swlsp-uriutil = { path = "../uriutil" }
swlsp-validation = { path = "../validation" }
serde_json = "1"
swlsp-parser-json = { path = "../parser-json" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-php-languagelevel = { path = "../php-languagelevel" }
swlsp-php-resolver = { path = "../php-resolver" }
swlsp-php-types = { path = "../php-types" }
swlsp-rewrite = { path = "../rewrite" }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
strsim = "0.11"
swlsp-doctrine = { path = "../doctrine" }
swlsp-event = { path = "../event" }
swlsp-indexer = { path = "../indexer" }
swlsp-parser-scss = { path = "../parser-scss" }
swlsp-parser-xpath = { path = "../parser-xpath" }
swlsp-php-project = { path = "../php-project" }
swlsp-shopware-dal = { path = "../shopware-dal" }
swlsp-suggestion = { path = "../suggestion" }
swlsp-environment = { path = "../environment" }
swlsp-httpclient = { path = "../httpclient" }
unicode-general-category = "1.1.0"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
flate2 = "1"
url = "2"

[dev-dependencies]
swlsp-ide = { path = "../ide", features = ["testing"] }
swlsp-indexer = { path = "../indexer" }
tempfile = "3"
