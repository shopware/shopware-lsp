[package]
name = "swlsp-projectconfig"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-pathmatch = { path = "../pathmatch" }
swlsp-uriutil = { path = "../uriutil" }
regex = "1"
saphyr = "0.3"
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
