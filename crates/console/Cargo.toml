[package]
name = "swlsp-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-indexer = { path = "../indexer" }
swlsp-lsp = { path = "../lsp" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-parser-xml = { path = "../parser-xml" }
swlsp-pathmatch = { path = "../pathmatch" }
swlsp-php = { path = "../php" }
swlsp-php-semantic = { path = "../php-semantic" }
swlsp-php-types = { path = "../php-types" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
