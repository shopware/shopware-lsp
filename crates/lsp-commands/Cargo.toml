[package]
name = "swlsp-lsp-commands"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-console = { path = "../console" }
swlsp-extension = { path = "../extension" }
swlsp-lsp = { path = "../lsp" }
swlsp-lsp-protocol = { path = "../lsp-protocol" }
swlsp-rewrite = { path = "../rewrite" }
swlsp-snippet = { path = "../snippet" }
swlsp-twig = { path = "../twig" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

[target.'cfg(target_os = "linux")'.dependencies]
simple-dns = "0.13"

[dev-dependencies]
swlsp-indexer = { path = "../indexer" }
tempfile = "3"
