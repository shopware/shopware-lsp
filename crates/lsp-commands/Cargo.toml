[package]
name = "swlsp-lsp-commands"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-console = { path = "../console" }
swlsp-extension = { path = "../extension" }
swlsp-lsp = { path = "../lsp" }
swlsp-lsp-protocol = { path = "../lsp-protocol" }
swlsp-rewrite = { path = "../rewrite" }
swlsp-snippet = { path = "../snippet" }
swlsp-twig = { path = "../twig" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP with rustls on ring and the bundled Mozilla roots: no CMake
# for aws-lc-rs in release builds, and no dependency on a system trust store.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
swlsp-indexer = { path = "../indexer" }
tempfile = "3"
