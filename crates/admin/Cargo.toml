[package]
name = "swlsp-admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swlsp_admin"

[dependencies]
swlsp-syntax.workspace = true
rowan = { workspace = true, features = ["serde1"] }
swlsp-indexer = { path = "../indexer" }
swlsp-parser-js = { path = "../parser-js" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-twig = { path = "../twig" }
swlsp-parser-vue = { path = "../parser-vue" }
swlsp-uriutil = { path = "../uriutil" }
swlsp-textutil = { path = "../textutil" }
serde = { version = "1", features = ["derive"] }
regex = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
