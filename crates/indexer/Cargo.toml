[package]
name = "swlsp-indexer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-language = { path = "../language" }
rusqlite = { version = "0.37", features = ["bundled"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
crossbeam-channel = "0.5"
ignore = "0.4"
notify = "8"
sha2 = "0.10"
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
log = "0.4"
swlsp-pathmatch = { path = "../pathmatch" }
swlsp-phar = { path = "../phar" }
filetime = "0.2"

[dev-dependencies]
tempfile = "3"
