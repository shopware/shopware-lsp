[package]
name = "swlsp-extension"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-indexer = { path = "../indexer" }
swlsp-parser-xml = { path = "../parser-xml" }
swlsp-parser-yaml = { path = "../parser-yaml" }
swlsp-php = { path = "../php" }
swlsp-php-binder = { path = "../php-binder" }
swlsp-php-semantic = { path = "../php-semantic" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
