[package]
name = "swlsp-lsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
tower-lsp-server.workspace = true
tower.workspace = true
futures.workspace = true
thiserror.workspace = true
swlsp-syntax.workspace = true
swlsp-language = { path = "../language" }
swlsp-lsp-protocol = { path = "../lsp-protocol" }
swlsp-projectconfig = { path = "../projectconfig" }
swlsp-projectdetect = { path = "../projectdetect" }
swlsp-integration = { path = "../integration" }
swlsp-uriutil = { path = "../uriutil" }
swlsp-textutil = { path = "../textutil" }
swlsp-indexer = { path = "../indexer" }
swlsp-rewrite = { path = "../rewrite" }
swlsp-parser-vue = { path = "../parser-vue" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
log = "0.4"

[dev-dependencies]
# The test client speaks JSON-RPC to the server through its own framing.
lsp-server = "0.7"
tempfile = "3"
swlsp-parser-js = { path = "../parser-js" }
swlsp-parser-json = { path = "../parser-json" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-parser-scss = { path = "../parser-scss" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-parser-xml = { path = "../parser-xml" }
swlsp-parser-yaml = { path = "../parser-yaml" }
