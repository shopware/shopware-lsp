[package]
name = "swlsp-symfony"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swlsp_symfony"


[dependencies]
swlsp-syntax.workspace = true
rowan = { workspace = true, features = ["serde1"] }
swlsp-indexer = { path = "../indexer" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-parser-xml = { path = "../parser-xml" }
swlsp-parser-yaml = { path = "../parser-yaml" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-parser-js = { path = "../parser-js" }
swlsp-php = { path = "../php" }
swlsp-php-inference = { path = "../php-inference" }
swlsp-php-project = { path = "../php-project" }
swlsp-php-semantic = { path = "../php-semantic" }
swlsp-php-types = { path = "../php-types" }
swlsp-pathmatch = { path = "../pathmatch" }
swlsp-textutil = { path = "../textutil" }
swlsp-uriutil = { path = "../uriutil" }
swlsp-admin-twigmigration = { path = "../admin-twigmigration" }
serde = { version = "1", features = ["derive"] }
regex = "1"
log = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
