[package]
name = "swlsp-twigcomponent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "swlsp_twigcomponent"

[dependencies]
swlsp-syntax.workspace = true
rowan = { workspace = true, features = ["serde1"] }
swlsp-indexer = { path = "../indexer" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-parser-yaml = { path = "../parser-yaml" }
swlsp-php = { path = "../php" }
swlsp-php-semantic = { path = "../php-semantic" }
swlsp-php-types = { path = "../php-types" }
swlsp-symfony = { path = "../symfony" }
swlsp-twig = { path = "../twig" }
serde = { version = "1", features = ["derive"] }
regex = "1"

[dev-dependencies]
tempfile = "3"
