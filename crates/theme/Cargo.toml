[package]
name = "swlsp-theme"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-indexer = { path = "../indexer" }
swlsp-parser-json = { path = "../parser-json" }
swlsp-extension = { path = "../extension" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
