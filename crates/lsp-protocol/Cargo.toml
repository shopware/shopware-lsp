[package]
name = "swlsp-lsp-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-projectconfig = { path = "../projectconfig" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact float parsing; the default parser can be one ulp off
# (e.g. 54/255 read back from JSON), which changes values clients receive.
serde_json = { version = "1", features = ["float_roundtrip"] }
