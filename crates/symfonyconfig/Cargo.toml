[package]
name = "swlsp-symfonyconfig"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-indexer = { path = "../indexer" }
swlsp-parser-php = { path = "../parser-php" }
swlsp-parser-yaml = { path = "../parser-yaml" }
glob = "0.3"
swlsp-uriutil = { path = "../uriutil" }
swlsp-php = { path = "../php" }
swlsp-php-types = { path = "../php-types" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
