[package]
name = "swlsp-style"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
swlsp-syntax.workspace = true
swlsp-indexer = { path = "../indexer" }
swlsp-parser-scss = { path = "../parser-scss" }
swlsp-parser-twig = { path = "../parser-twig" }
swlsp-theme = { path = "../theme" }
swlsp-uriutil = { path = "../uriutil" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
