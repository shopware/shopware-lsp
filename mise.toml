[tools]
go = "1.27.0"
node = "24.18.1"
golangci-lint = "2.13.0"
"npm:@vscode/vsce" = "3.9.1"

[env]
CGO_ENABLED = "1"

[tasks.setup]
description = "Install Go and VSCode extension dependencies"
run = [
  "go mod download",
  "npm --prefix editors/vscode ci",
]

[tasks.build]
description = "Build the language server"
run = "go build ./..."

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."

[tasks."test:simd"]
description = "Run parser tests with Go's experimental SIMD implementation"
run = "GOEXPERIMENT=simd go test ./internal/parser/..."

[tasks.bench]
description = "Run the Go benchmarks through the CodSpeed walltime runner"
run = "codspeed run --mode walltime -- go test -bench=. ./internal/..."

[tasks."test:race"]
description = "Run internal Go tests with the race detector"
run = "go test -race ./internal/..."

[tasks."test:integration-compile"]
description = "Compile opt-in real-world integration tests without running them"
run = "go test -tags=integration ./internal/app -run '^$'"

[tasks.lint]
description = "Run Go lint checks"
run = "golangci-lint run"

[tasks."vscode:install"]
description = "Install VSCode extension dependencies"
dir = "editors/vscode"
run = "npm ci"

[tasks."vscode:check"]
description = "Type-check the VSCode extension"
dir = "editors/vscode"
run = "npm run check-types"

[tasks."vscode:build"]
description = "Build the VSCode extension"
dir = "editors/vscode"
run = "npm run compile"

[tasks."vscode:test"]
description = "Run VSCode extension tests"
dir = "editors/vscode"
run = [
  "npm run test:entity-designer",
  "npm run test:configuration",
  "npm run test:mcp",
  "npm run test:project-detection",
  "npm run test:workspace-roots",
  "npm run test:workspace-clients",
]

[tasks.release]
description = "Build platform-specific VSIX packages into out/"
depends = ["vscode:install"]
run = "node scripts/build-vsix-release.mjs"

[tasks."zed:check"]
description = "Check Zed extension formatting and Rust lint"
dir = "editors/zed"
run = ["cargo fmt --check", "cargo clippy --locked --all-targets -- -D warnings"]

[tasks."zed:test"]
description = "Run Zed extension and task adapter tests"
dir = "editors/zed"
run = ["cargo test --locked", "python3 scripts/test-sw-action.py"]

[tasks."zed:build"]
description = "Build the Zed WASM extension"
dir = "editors/zed"
run = "cargo build --locked --release --target wasm32-wasip2"

[tasks."zed:contracts"]
description = "Check Zed contracts against the local server and VS Code manifest"
run = "bash editors/zed/scripts/check-local.sh"

[tasks.check]
description = "Run backend and editor validation"
depends = ["test", "test:integration-compile", "lint", "vscode:check", "vscode:test", "zed:check", "zed:test", "zed:build", "zed:contracts"]

[tasks.default]
description = "Build the backend and VSCode extension"
depends = ["build", "vscode:build"]
