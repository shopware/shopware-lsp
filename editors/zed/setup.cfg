# Mutation testing, on demand. See TESTING.md.
#
# mutmut copies only the mutated source into mutants/, so the test file and
# everything it reads have to be listed in also_copy or the run reports every
# mutant as killed by collection errors.
[mutmut]
source_paths=scripts/sw-action.py
also_copy=
    scripts/test-sw-action.py
    README.md
    inventory/
    examples/
pytest_add_cli_args=scripts/test-sw-action.py

# The test file is hyphenated to match the scripts beside it, which pytest
# does not discover by default.
[tool:pytest]
python_files = test-*.py test_*.py
