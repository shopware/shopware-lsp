name: Set up Go with a rolling build cache
description: Keep each job's compiled packages across source changes
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7.0.0
      id: go
      with:
        go-version-file: go.mod
        cache: false

    - name: Locate Go caches
      id: paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.paths.outputs.modules }}
        key: go-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}

    - name: Cache compiled Go packages
      uses: actions/cache@v6.1.0
      with:
        path: ${{ steps.paths.outputs.build }}
        # Separate race/lint/test outputs; save new builds even when go.sum
        # stays unchanged. Go validates restored entries against their inputs.
        key: go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ github.job }}-
