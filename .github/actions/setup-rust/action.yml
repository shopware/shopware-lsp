name: Set up the pinned Rust toolchain
description: Install the toolchain from rust-toolchain.toml, extra targets, and a Cargo cache
inputs:
  targets:
    description: Space-separated extra Rust targets to install
    required: false
    default: ''
  cache-key:
    description: >-
      Names the cache. Jobs that compile the same thing share a key, in any
      workflow; the runner's OS and architecture, the toolchain and Cargo.lock
      are part of the cache key already.
    required: true
  save-cache:
    description: >-
      Whether to save the cache after the job. A cache saved by a tag run can
      only be restored by that tag, so release builds restore the cache of
      the default branch and save nothing.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        # rust-toolchain.toml at the repository root pins the channel and
        # components; this installs exactly that toolchain.
        rustup toolchain install
        for target in $TARGETS; do
          rustup target add "$target"
        done
        rustc --version
        cargo --version

    # Caches ~/.cargo (registry index, crate sources, git checkouts) and the
    # dependency artifacts in target/; workspace crates are rebuilt.
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}
        # A failed test run still compiled the dependencies.
        cache-on-failure: true
