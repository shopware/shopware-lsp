name: Release

on:
  push:
    tags:
      # Semver tags; only even minors (stable channel) run this pipeline
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write

jobs:
  route:
    name: Check stable tag
    runs-on: ubuntu-latest
    outputs:
      pre-release: ${{ steps.parity.outputs.pre-release }}
    steps:
      - name: Compute minor parity
        id: parity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          minor="$(echo "$TAG" | cut -d. -f2)"
          echo "pre-release=$((minor % 2))" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build release binaries
    needs: route
    if: needs.route.outputs.pre-release == '0'
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  release-lsp:
    name: Release LSP
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download release binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: server-*
          path: ${{ runner.temp }}/binaries

      - name: Stage release binaries
        run: scripts/release/stage-binaries.sh "$RUNNER_TEMP/binaries"

      - name: Package archives
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release/package-release.sh "$TAG" dist

      # A draft until the VSIX packages are attached (github-release below).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/*.zip dist/checksums.txt
          --draft --verify-tag --generate-notes --title "$TAG"

  build:
    name: Build VSIX packages
    needs: release-lsp
    uses: ./.github/workflows/build-vsix.yml
    with:
      version: ${{ github.ref_name }}
      pre-release: false

  github-release:
    name: Attach VSIX packages and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download VSIX packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: vsix-packages
          path: out

      - name: Verify checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/*.vsix out/SHA256SUMS --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  homebrew:
    name: Update Homebrew cask
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Gather Homebrew Token
        uses: octo-sts/action@v1.1.1
        id: sts-shopware
        with:
          scope: shopware/homebrew-tap
          identity: lsp

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"

      # Runs after the release is public, so the cask never points at
      # draft-only download URLs.
      - name: Write and push the cask
        env:
          TAP_TOKEN: ${{ steps.sts-shopware.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/shopware/homebrew-tap.git" "$tap"
          scripts/release/update-homebrew-cask.sh "$TAG" "$RUNNER_TEMP/checksums.txt" "$tap"
          cd "$tap"
          git add Casks/shopware-lsp.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git -c user.name=shopwareBot -c user.email=4725494+shopwareBot@users.noreply.github.com \
            commit -m "shopware-lsp $TAG"
          git push origin HEAD

  publish:
    name: Publish to marketplaces
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install publishing tools
        run: npm install --global @vscode/vsce@3.9.1 ovsx@1.1.1

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release download "$TAG"
          --pattern "*.vsix" --pattern "SHA256SUMS"
          --dir out

      - name: Verify release packages
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Publish to Visual Studio Marketplace
        run: vsce publish --skip-duplicate --packagePath out/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PUBLISH_TOKEN }}

      - name: Publish to Open VSX
        run: ovsx publish --skip-duplicate --packagePath out/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PUBLISH_TOKEN }}
