name: Release

on:
  push:
    tags:
      # Semver tags; only even minors (stable channel) run this pipeline
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write

jobs:
  route:
    name: Check stable tag
    runs-on: ubuntu-latest
    outputs:
      pre-release: ${{ steps.parity.outputs.pre-release }}
    steps:
      - name: Compute minor parity
        id: parity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          minor="$(echo "$TAG" | cut -d. -f2)"
          echo "pre-release=$((minor % 2))" >> "$GITHUB_OUTPUT"

  release-lsp:
    name: Release LSP
    needs: route
    if: needs.route.outputs.pre-release == '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gather Homebrew Token
        uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # ratchet:octo-sts/action@v1.0.0
        id: sts-shopware
        with:
          scope: shopware/homebrew-tap
          identity: lsp

      - name: Release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.sts-shopware.outputs.token }}

  build:
    name: Build VSIX packages
    needs: release-lsp
    uses: ./.github/workflows/build-vsix.yml
    with:
      version: ${{ github.ref_name }}
      pre-release: false

  github-release:
    name: Attach VSIX packages and publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download VSIX packages
        uses: actions/download-artifact@v8
        with:
          name: vsix-packages
          path: out

      - name: Verify checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/*.vsix out/SHA256SUMS --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  publish:
    name: Publish to marketplaces
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install publishing tools
        run: npm install --global @vscode/vsce@3.9.1 ovsx@1.1.1

      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release download "$TAG"
          --pattern "*.vsix" --pattern "SHA256SUMS"
          --dir out

      - name: Verify release packages
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Publish to Visual Studio Marketplace
        run: vsce publish --skip-duplicate --packagePath out/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PUBLISH_TOKEN }}

      - name: Publish to Open VSX
        run: ovsx publish --skip-duplicate --packagePath out/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PUBLISH_TOKEN }}
