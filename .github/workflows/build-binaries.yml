name: Build release binaries

# Builds the shipped Rust server (crates/cli, binary shopware-lsp) for every
# release target and uploads one artifact per Rust target triple, named
# server-<triple>. scripts/release/stage-binaries.sh lays them out under
# target/, then scripts/release/package-release.sh (zip archives, checksums)
# and scripts/build-vsix-release.mjs (VSIX) consume them.
#
# - Linux amd64/arm64/armv7, two builds each:
#   - glibc (default archives, linux-* VSIX, Homebrew): dynamically linked,
#     built with cargo-zigbuild against a glibc 2.17 floor so it runs on every
#     mainstream distribution with the system resolver and allocator. A step
#     fails the build if any symbol needs a newer glibc.
#   - musl (*_musl archives, alpine-* VSIX): fully static, with mimalloc
#     instead of musl's malloc (crates/cli/src/main.rs). The bundled SQLite and
#     mimalloc are C, so amd64/arm64 build natively with musl-tools' musl-gcc
#     and armv7 cross-compiles with cargo-zigbuild.
# - macOS x86_64 and arm64, built on an Apple Silicon runner.
# - Windows x86_64 (MSVC, static CRT so no VC++ redistributable is needed).

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the binary (SHOPWARE_LSP_VERSION)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc builds (default Linux packages): dynamically linked against a
          # glibc 2.17 floor through cargo-zigbuild, so they run on every
          # mainstream distribution and use the system resolver and malloc.
          - target: x86_64-unknown-linux-gnu
            zig-target: x86_64-unknown-linux-gnu.2.17
            runner: ubuntu-24.04
            zigbuild: true
            glibc-floor: '2.17'
            smoke: true
          - target: aarch64-unknown-linux-gnu
            zig-target: aarch64-unknown-linux-gnu.2.17
            runner: ubuntu-24.04-arm
            zigbuild: true
            glibc-floor: '2.17'
            smoke: true
          - target: armv7-unknown-linux-gnueabihf
            zig-target: armv7-unknown-linux-gnueabihf.2.17
            runner: ubuntu-24.04
            zigbuild: true
            glibc-floor: '2.17'
            smoke: false
          # musl builds (Alpine and fully static use): static, with mimalloc.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            static: true
            musl-tools: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            static: true
            musl-tools: true
            smoke: true
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-24.04
            static: true
            zigbuild: true
            smoke: false
          - target: aarch64-apple-darwin
            runner: macos-15
            smoke: true
          - target: x86_64-apple-darwin
            runner: macos-15
            smoke: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            smoke: true
    env:
      SHOPWARE_LSP_VERSION: ${{ inputs.version }}
      # Keep symbol names for panic backtraces; drop DWARF line tables to keep
      # the binaries (and VSIX downloads) small, as Go's -s -w did.
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      # musl targets link statically by default. musl-tools installs one
      # musl-gcc wrapper for the runner's own architecture; cc-rs would look
      # for aarch64-linux-musl-gcc on arm64.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install musl-gcc
        if: matrix.musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-zigbuild@0.24.0

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        # The dist profile strips symbols and debug info (see Cargo.toml).
        env:
          CARGO_BUILD_COMMAND: ${{ matrix.zigbuild && 'zigbuild' || 'build' }}
          BUILD_TARGET: ${{ matrix.zig-target || matrix.target }}
        run: cargo "$CARGO_BUILD_COMMAND" --locked --profile dist -p swlsp-cli --bin shopware-lsp --target "$BUILD_TARGET"

      - name: Locate binary
        id: binary
        shell: bash
        run: |
          name=shopware-lsp
          case "${{ matrix.target }}" in *-windows-*) name=shopware-lsp.exe ;; esac
          path="target/${{ matrix.target }}/dist/$name"
          test -s "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Require a static Linux binary
        if: matrix.static
        env:
          BINARY: ${{ steps.binary.outputs.path }}
        run: |
          description="$(file -b "$BINARY")"
          echo "$description"
          case "$description" in
            *"statically linked"*|*"static-pie linked"*) ;;
            *) echo "::error::$BINARY is not statically linked"; exit 1 ;;
          esac

      - name: Require the glibc floor
        if: matrix.glibc-floor
        env:
          BINARY: ${{ steps.binary.outputs.path }}
          FLOOR: ${{ matrix.glibc-floor }}
        run: |
          newest="$(objdump -T "$BINARY" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -Vu | tail -1)"
          echo "newest required glibc symbol version: $newest (floor $FLOOR)"
          if [ "$(printf '%s\n%s\n' "$newest" "$FLOOR" | sort -V | tail -1)" != "$FLOOR" ]; then
            echo "::error::$BINARY needs glibc $newest, newer than the $FLOOR floor"
            exit 1
          fi

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        env:
          BINARY: ${{ steps.binary.outputs.path }}
        run: |
          output="$("$BINARY" version)"
          echo "$output"
          case "$output" in
            *"$SHOPWARE_LSP_VERSION"*) ;;
            *) echo "::error::binary does not report version $SHOPWARE_LSP_VERSION"; exit 1 ;;
          esac

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: server-${{ matrix.target }}
          path: ${{ steps.binary.outputs.path }}
          if-no-files-found: error
          retention-days: 7
