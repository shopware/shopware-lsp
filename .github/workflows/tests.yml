name: Go Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, feat/next-gen ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Compile real-world integration suite
      run: go test -tags=integration ./internal/app -run '^$'

    - name: Run race condition tests
      run: go test -race ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.0
        args: --timeout=5m

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.18.1'
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install dependencies
      run: npm --prefix editors/vscode ci

    - name: Check types
      run: npm --prefix editors/vscode run check-types

    - name: Run tests
      run: |
        npm --prefix editors/vscode run test:entity-designer
        npm --prefix editors/vscode run test:configuration
        npm --prefix editors/vscode run test:mcp
        npm --prefix editors/vscode run test:project-detection
        npm --prefix editors/vscode run test:workspace-roots
        npm --prefix editors/vscode run test:workspace-clients

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Install pinned Rust toolchain and WASM target
      run: rustup show

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: editors/zed

    - name: Check formatting and lint
      run: |
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: |
        cargo test --locked
        python3 scripts/test-sw-action.py

    - name: Build WASM extension
      run: |
        cargo build --locked --release --target wasm32-wasip2
        test -s target/wasm32-wasip2/release/zed_shopware_lsp.wasm

    - name: Check local server contracts and editor parity
      run: bash scripts/check-local.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, vscode, zed]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Build LSP server
      run: go build -v ./...
