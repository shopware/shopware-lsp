name: Go Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v ./...

    - name: Compile real-world integration suite
      run: go test -tags=integration ./internal/app -run '^$'

    - name: Run race condition tests
      run: go test -race ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.0
        args: --timeout=5m

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.18.1'
        cache: npm
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install dependencies
      run: npm --prefix vscode-extension ci

    - name: Check types
      run: npm --prefix vscode-extension run check-types

    - name: Run tests
      run: |
        npm --prefix vscode-extension run test:entity-designer
        npm --prefix vscode-extension run test:configuration
        npm --prefix vscode-extension run test:mcp
        npm --prefix vscode-extension run test:project-detection
        npm --prefix vscode-extension run test:workspace-roots
        npm --prefix vscode-extension run test:workspace-clients

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, vscode]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.27.0'
        cache: true

    - name: Build LSP server
      run: go build -v ./...
