name: Go Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-go/**'
  pull_request:
    branches: [ main, feat/next-gen ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-go/**'

jobs:
  test:
    name: Test
    needs: [unit, race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both Go test runs
      env:
        UNIT_RESULT: ${{ needs.unit.result }}
        RACE_RESULT: ${{ needs.race.result }}
      run: test "$UNIT_RESULT" = success && test "$RACE_RESULT" = success

  unit:
    name: Go tests and build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: ./.github/actions/setup-go

    - name: Install dependencies
      run: go mod download

    - name: Install gotestsum
      uses: jaxxstorm/action-install-gh-release@v1.10.0
      with:
        repo: gotestyourself/gotestsum
        tag: v1.13.0
        cache: enable

    - name: Run tests
      run: gotestsum --format pkgname -- -count=1 ./...

    - name: Compile real-world integration suite
      run: go test -c -tags=integration ./internal/app -o "${RUNNER_TEMP}/app-integration.test"

    - name: Build LSP server
      run: go build -v ./...

  race:
    name: Go race tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: ./.github/actions/setup-go

    - name: Install gotestsum
      uses: jaxxstorm/action-install-gh-release@v1.10.0
      with:
        repo: gotestyourself/gotestsum
        tag: v1.13.0
        cache: enable

    - name: Run race condition tests
      run: gotestsum --format pkgname -- -race -count=1 ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: ./.github/actions/setup-go

    - name: Run linting
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.0
        args: --timeout=5m

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.18.1'
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install dependencies
      run: npm --prefix editors/vscode ci

    - name: Run tests
      run: npm --prefix editors/vscode test

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Go
      uses: ./.github/actions/setup-go

    - name: Install pinned Rust toolchain and WASM target
      run: rustup show

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: editors/zed

    - name: Check formatting and lint
      run: |
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: |
        cargo test --locked
        python3 scripts/test-sw-action.py

    - name: Build WASM extension
      run: |
        cargo build --locked --release --target wasm32-wasip2
        test -s target/wasm32-wasip2/release/zed_shopware_lsp.wasm

    - name: Check local server contracts and editor parity
      run: bash scripts/check-local.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, vscode, zed]
    if: ${{ always() }}
    steps:
    # Preserve the existing required check while building in the unit job,
    # where compiled packages are already available.
    - name: Require all checks
      env:
        RESULTS: ${{ join(needs.*.result, ',') }}
      run: test "$RESULTS" = success,success,success,success
