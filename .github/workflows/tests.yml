name: Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - '**.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'about.toml'
      - 'about.hbs'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-go/**'
      - '.github/actions/setup-rust/**'
  pull_request:
    branches: [ main, feat/next-gen ]
    paths:
      - '**.go'
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - 'go.mod'
      - 'go.sum'
      - '**.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'about.toml'
      - 'about.hbs'
      - '.golangci.yml'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-go/**'
      - '.github/actions/setup-rust/**'

jobs:
  test:
    name: Test
    needs: [unit, race]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require both Go test runs
      env:
        UNIT_RESULT: ${{ needs.unit.result }}
        RACE_RESULT: ${{ needs.race.result }}
      run: test "$UNIT_RESULT" = success && test "$RACE_RESULT" = success

  rust-lint:
    name: Rust format and lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: lint

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Run clippy
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: notices

    - name: Install cargo-about
      uses: taiki-e/install-action@v2.87.31
      with:
        tool: cargo-about@0.9.2

    - name: Require an up-to-date THIRD_PARTY_NOTICES.md
      # Regenerate with `make notices` after changing dependencies.
      run: make notices-check

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: test

    - name: Run tests
      # Doc-tests are skipped (there are none); see RUST_TEST_TARGETS in the
      # Makefile.
      run: cargo test --workspace --locked --lib --bins --tests --examples

    - name: Compile real-world integration suite
      run: make rust-test-integration-compile

    - name: Build the shipped server
      run: cargo build --locked --release -p swlsp-cli --bin shopware-lsp

  unit:
    name: Go tests and build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: $/.github/actions/setup-go

    - name: Install dependencies
      run: go mod download

    - name: Install gotestsum
      uses: jaxxstorm/action-install-gh-release@v3.0.0
      with:
        repo: gotestyourself/gotestsum
        tag: v1.13.0
        cache: enable

    - name: Run tests
      run: gotestsum --format pkgname -- -count=1 ./...

    - name: Compile real-world integration suite
      run: go test -c -tags=integration ./internal/app -o "${RUNNER_TEMP}/app-integration.test"

    - name: Build LSP server
      run: go build -v ./...

  race:
    name: Go race tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: $/.github/actions/setup-go

    - name: Install gotestsum
      uses: jaxxstorm/action-install-gh-release@v3.0.0
      with:
        repo: gotestyourself/gotestsum
        tag: v1.13.0
        cache: enable

    - name: Run race condition tests
      run: gotestsum --format pkgname -- -race -count=1 ./internal/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: $/.github/actions/setup-go

    - name: Run linting
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.0
        args: --timeout=5m

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.18.1'
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install dependencies
      run: npm --prefix editors/vscode ci

    - name: Run tests
      run: npm --prefix editors/vscode test

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Install pinned Rust toolchains and WASM target
      # editors/zed pins its own toolchain with the wasm32-wasip2 target; the
      # contract check builds the server with the root toolchain.
      run: |
        rustup show
        (cd ../.. && rustup toolchain install)

    - uses: Swatinem/rust-cache@v2.9.3
      with:
        workspaces: |
          editors/zed
          .

    - name: Check formatting and lint
      run: |
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: |
        cargo test --locked
        python3 scripts/test-sw-action.py

    - name: Build WASM extension
      run: |
        cargo build --locked --release --target wasm32-wasip2
        test -s target/wasm32-wasip2/release/zed_shopware_lsp.wasm

    - name: Check local server contracts and editor parity
      run: bash scripts/check-local.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, rust-lint, rust, vscode, zed]
    if: ${{ always() }}
    steps:
    # Preserve the existing required check while building in the unit job,
    # where compiled packages are already available.
    - name: Require all checks
      env:
        RESULTS: ${{ join(needs.*.result, ',') }}
      run: test "$RESULTS" = success,success,success,success,success,success
