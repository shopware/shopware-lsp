name: Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - '**.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'about.toml'
      - 'about.hbs'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-rust/**'
  pull_request:
    branches: [ main, feat/next-gen ]
    paths:
      - 'editors/vscode/**'
      - 'editors/zed/**'
      - '**.rs'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'about.toml'
      - 'about.hbs'
      - '.github/workflows/tests.yml'
      - '.github/actions/setup-rust/**'

permissions:
  contents: read

# A newer push to a pull request replaces the run in progress. Runs on main
# and runs called by the release finish, so every commit there has a result.
concurrency:
  # Not the name of a calling workflow's own group: group names ignore case,
  # and a called workflow waiting for its caller's group never starts.
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    needs: [rust, notices]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - name: Require the Rust test runs and the notices check
      env:
        RESULTS: ${{ join(needs.*.result, ',') }}
      run: test "$RESULTS" = success,success

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: lint

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Run clippy
      run: cargo clippy --locked --workspace --all-targets -- -D warnings

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: notices

    - name: Install cargo-about
      uses: taiki-e/install-action@v2.87.31
      with:
        tool: cargo-about@0.9.2

    - name: Require an up-to-date THIRD_PARTY_NOTICES.md
      # Regenerate with `make notices` after changing dependencies.
      run: make notices-check

  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Rust
      uses: $/.github/actions/setup-rust
      with:
        cache-key: test

    - name: Run tests
      # Doc-tests are skipped (there are none); see RUST_TEST_TARGETS in the
      # Makefile.
      run: cargo test --workspace --locked --lib --bins --tests --examples

    - name: Compile real-world integration suite
      run: make rust-test-integration-compile

    - name: Build the shipped server
      run: cargo build --locked --release -p swlsp-cli --bin shopware-lsp

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.18.1'
        cache: npm
        cache-dependency-path: editors/vscode/package-lock.json

    - name: Install dependencies
      run: npm --prefix editors/vscode ci

    - name: Run tests
      run: npm --prefix editors/vscode test

  zed:
    name: Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/zed
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Install pinned Rust toolchains and WASM target
      # editors/zed pins its own toolchain with the wasm32-wasip2 target; the
      # contract check builds the server with the root toolchain.
      run: |
        rustup show
        (cd ../.. && rustup toolchain install)

    # Two workspaces: the extension, and the server the contract check builds
    # in debug mode.
    - uses: Swatinem/rust-cache@v2.9.3
      with:
        shared-key: zed
        cache-on-failure: true
        workspaces: |
          editors/zed
          .

    - name: Check formatting and lint
      run: |
        cargo fmt --check
        cargo clippy --locked --all-targets -- -D warnings

    - name: Run tests
      run: |
        cargo test --locked
        python3 scripts/test-sw-action.py

    - name: Build WASM extension
      run: |
        cargo build --locked --release --target wasm32-wasip2
        test -s target/wasm32-wasip2/release/zed_shopware_lsp.wasm

    - name: Check local server contracts and editor parity
      run: bash scripts/check-local.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, rust, vscode, zed]
    if: ${{ always() }}
    steps:
    - name: Require all checks
      env:
        RESULTS: ${{ join(needs.*.result, ',') }}
      run: test "$RESULTS" = success,success,success,success,success
