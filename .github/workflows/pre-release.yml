name: Pre-release

on:
  push:
    tags:
      # Semver tags; only odd minors (pre-release channel) run this pipeline
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  route:
    name: Check pre-release tag
    runs-on: ubuntu-latest
    outputs:
      pre-release: ${{ steps.parity.outputs.pre-release }}
    steps:
      - name: Compute minor parity
        id: parity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          minor="$(echo "$TAG" | cut -d. -f2)"
          echo "pre-release=$((minor % 2))" >> "$GITHUB_OUTPUT"

  validate:
    needs: route
    if: needs.route.outputs.pre-release == '1'
    uses: ./.github/workflows/tests.yml

  release-lsp:
    name: Release LSP
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Creates a draft release with the binary archives and deb/rpm/apk
      # packages. Pre-releases never update the Homebrew tap.
      - name: Release
        run: make release GORELEASER_ARGS=--skip=homebrew
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build VSIX packages
    needs: validate
    uses: ./.github/workflows/build-vsix.yml
    with:
      version: ${{ github.ref_name }}
      pre-release: true

  github-release:
    name: Attach VSIX packages and publish pre-release
    needs: [release-lsp, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download VSIX packages
        uses: actions/download-artifact@v8
        with:
          name: vsix-packages
          path: out

      - name: Verify checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" out/*.vsix out/SHA256SUMS --clobber

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --prerelease --latest=false

  publish:
    name: Publish pre-release to marketplaces
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install publishing tools
        run: npm install --global @vscode/vsce@3.9.1 ovsx@1.1.1

      - name: Download pre-release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release download "$TAG"
          --pattern "*.vsix" --pattern "SHA256SUMS"
          --dir out

      - name: Verify pre-release packages
        working-directory: out
        run: sha256sum --check SHA256SUMS

      - name: Publish to Visual Studio Marketplace
        run: vsce publish --pre-release --skip-duplicate --packagePath out/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PUBLISH_TOKEN }}

      - name: Publish to Open VSX
        run: ovsx publish --pre-release --skip-duplicate --packagePath out/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PUBLISH_TOKEN }}

      - name: Add publishing summary
        env:
          PREVIEW_VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "### Published VSIX pre-release ${PREVIEW_VERSION}"
            echo ""
            echo "- [Visual Studio Marketplace](https://marketplace.visualstudio.com/items?itemName=shopware.shopware-lsp)"
            echo "- [Open VSX](https://open-vsx.org/extension/shopware/shopware-lsp)"
          } >> "$GITHUB_STEP_SUMMARY"
