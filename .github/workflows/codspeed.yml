name: CodSpeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/next-gen ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Benchmarks
    # Keep the instance type fixed so walltime results use the same CPU generation.
    runs-on: runs-on=${{ github.run_id }}/cpu=2/family=m8g.large/image=ubuntu24-full-arm64/spot=price-capacity-optimized
    timeout-minutes: 25
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      CGO_ENABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Find benchmark packages
        id: packages
        # Only build packages that define benchmarks: the CodSpeed runner uses an
        # isolated, cold GOCACHE, so every extra package is compiled from scratch.
        run: |
          packages="$(grep -rl --include='*_test.go' '^func Benchmark' internal \
            | xargs -n1 dirname | sort -u | sed 's|^|./|' | tr '\n' ' ')"
          echo "list=${packages}" >> "$GITHUB_OUTPUT"

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          # The runner defaults to 3s per benchmark; 1s still yields 100 measured
          # rounds per benchmark and keeps the run within a few minutes.
          run: go test -bench=. -benchtime=1s ${{ steps.packages.outputs.list }}
        env:
          # Go on arm64 needs frame-pointer unwinding for complete flamegraphs.
          CODSPEED_PERF_UNWINDING_MODE: fp
