name: CodSpeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/next-gen ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Benchmarks
    # Keep the instance type fixed so walltime results use the same CPU generation.
    runs-on: runs-on=${{ github.run_id }}/cpu=2/family=m8g.large/image=ubuntu24-full-arm64/spot=price-capacity-optimized
    timeout-minutes: 45
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      CGO_ENABLED: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          run: >-
            go test -bench=.
            ./internal/parser/bytescan/...
            ./internal/parser/cst/...
            ./internal/parser
            ./internal/parser/javascript/...
            ./internal/parser/twig/...
            ./internal/php/semantic/...
            ./internal/php/stubs/...
            ./internal/php
            ./internal/php/imports/...
            ./internal/php/inference/...
            ./internal/php/refactoring/...
            ./internal/php/resolver/...
            ./internal/php/types/...
            ./internal/admin/...
            ./internal/doctrine/...
            ./internal/indexer/...
            ./internal/lsp/...
            ./internal/projectconfig/...
            ./internal/shopware/...
            ./internal/symfony/...
            ./internal/translation/...
        env:
          # Go on arm64 needs frame-pointer unwinding for complete flamegraphs.
          CODSPEED_PERF_UNWINDING_MODE: fp
