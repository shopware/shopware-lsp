name: CodSpeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/next-gen ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Benchmarks
    # Keep the instance type fixed so walltime results use the same CPU generation.
    runs-on: runs-on=${{ github.run_id }}/cpu=2/family=m8g.large/image=ubuntu24-full-arm64/spot=price-capacity-optimized
    timeout-minutes: 25
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: $/.github/actions/setup-rust
        with:
          cache-key: codspeed

      - name: Install cargo-codspeed
        run: cargo install --locked cargo-codspeed --version 6.0.0

      - name: Build the benchmarks
        # Only swlsp-bench defines benchmarks.
        run: cargo codspeed build -p swlsp-bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5.6.0
        with:
          mode: walltime
          run: cargo codspeed run -p swlsp-bench
