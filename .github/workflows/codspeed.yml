name: CodSpeed Benchmarks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feat/next-gen ]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.shard.name }})
    runs-on: codspeed-macro
    timeout-minutes: 45
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    env:
      CGO_ENABLED: '1'
    strategy:
      fail-fast: false
      matrix:
        # Benchmarks are sharded across parallel jobs to keep each run short.
        # CodSpeed merges the shards back into a single report.
        shard:
          - name: parser-scanner
            packages: ./internal/parser/bytescan/... ./internal/parser/cst/...
          - name: parser-languages
            packages: ./internal/parser ./internal/parser/javascript/... ./internal/parser/twig/...
          - name: php-semantic
            packages: ./internal/php/semantic/... ./internal/php/stubs/...
          - name: php-analysis
            packages: ./internal/php ./internal/php/imports/... ./internal/php/inference/... ./internal/php/refactoring/... ./internal/php/resolver/... ./internal/php/types/...
          - name: workspace
            packages: ./internal/admin/... ./internal/doctrine/... ./internal/indexer/... ./internal/lsp/... ./internal/projectconfig/... ./internal/shopware/... ./internal/symfony/... ./internal/translation/...
          - name: app
            packages: ./internal/app/...

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: walltime
          # Unit tests already run in the test workflow; -run '^$' keeps the
          # benchmark shards focused and short.
          run: go test -run '^$' -bench=. ${{ matrix.shard.packages }}
        env:
          # Go on arm64 needs frame-pointer unwinding for complete flamegraphs.
          CODSPEED_PERF_UNWINDING_MODE: fp
